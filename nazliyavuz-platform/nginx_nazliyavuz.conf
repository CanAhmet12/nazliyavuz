server {
    listen 80;
    server_name 34.14.61.40;
    root /var/www/nazliyavuz-backend/public;
    
    index index.php index.html;
    
    charset utf-8;
    
    # Logs
    access_log /var/log/nginx/nazliyavuz-access.log;
    error_log /var/log/nginx/nazliyavuz-error.log;
    
    # Client max body size (for file uploads)
    client_max_body_size 100M;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Hide .files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Protect sensitive directories (excluding public storage)
    location ~ /(bootstrap/cache|database|config|routes|resources) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Allow access to public storage (uploaded files)
    location /storage/ {
        alias /var/www/nazliyavuz-backend/storage/app/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Health check
    location /health {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        
        # FastCGI optimizations
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_connect_timeout 300;
    }
    
    # Deny .htaccess
    location ~ /\.ht {
        deny all;
    }
}

